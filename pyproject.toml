[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pipecat-guardrails"
version = "0.0.1"
description = "Output guardrails for Pipecat voice agents: check what the bot is about to say, and stop it before it is spoken."
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Apoorv Mittal" }]
keywords = ["pipecat", "guardrails", "voice", "llm", "safety", "moderation", "tts"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# Pipecat supplies the classifier and LLM-judge backends (pipecat.classifiers),
# the OpenAI SDK, and the frame-processor base class.
dependencies = ["pipecat-ai>=1.12,<2"]

[project.optional-dependencies]
jev = ["pipecat-ai[jev]>=1.12,<2"]  # TypeSafe Jev classifier client

[project.urls]
Homepage = "https://github.com/Apoorv012/pipecat-guardrails"
Repository = "https://github.com/Apoorv012/pipecat-guardrails"
Issues = "https://github.com/Apoorv012/pipecat-guardrails/issues"
Changelog = "https://github.com/Apoorv012/pipecat-guardrails/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "pre-commit>=4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pipecat_guardrails"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.md"]  # code samples in docs are formatted by hand

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "D"]
ignore = ["D105", "D107"]  # magic methods and __init__ are documented on the class

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--strict-markers", "--strict-config"]

[tool.coverage.run]
source = ["pipecat_guardrails"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
